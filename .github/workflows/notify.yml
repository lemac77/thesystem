name: Daily Notifications

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'morning o evening'
        required: false
        default: 'morning'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning notification
        if: github.event.schedule == '0 7 * * *' || github.event.inputs.type == 'morning'
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic ${{ secrets.ONESIGNAL_API_KEY }}" \
            -d '{
              "app_id": "0cf17851-6b75-4374-b5a0-2d1a41200a62",
              "included_segments": ["All"],
              "headings": {"en": "⚡ The System"},
              "contents": {"en": "Controlla le tue task di oggi. Nessuna scusa."}
            }' \
            https://onesignal.com/api/v1/notifications

      - name: Send evening notification
        if: github.event.schedule == '0 21 * * *' || github.event.inputs.type == 'evening'
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic ${{ secrets.ONESIGNAL_API_KEY }}" \
            -d '{
              "app_id": "0cf17851-6b75-4374-b5a0-2d1a41200a62",
              "included_segments": ["All"],
              "headings": {"en": "📓 The System"},
              "contents": {"en": "Compila il resoconto della giornata nel Diario."}
            }' \
            https://onesignal.com/api/v1/notifications
